<body>
<img src="home1.png" class="background-img">
    <header>

                <li><a href="Glistéra-home.html">الصفحة الرئيسية</a></li>

            </ul>
        </nav>
    </header>
 
    <main>
        <h1>إنشاء حساب جديد</h1>
        <form onsubmit="return validate()" action="RegisterSuccess.html" method="POST">
    <label for="name">الاسم الكامل:</label>
    <input type="text" id="name" name="name" required>
 
    <label for="email">البريد الإلكتروني:</label>
    <input type="email" id="email" name="email" required>
 
    <label for="password">كلمة المرور:</label>
    <input type="password" id="password" name="password" required>
 
    <label for="confirm-password">تأكيد كلمة المرور:</label>
    <input type="password" id="confirm-password" name="confirm-password" required>
 <button type="button" onclick="validateAndRedirect()">إنشاء الحساب</button>
</form>
<p>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
    </main>
 
    <footer class="footer">
        <p>جميع الحقوق محفوظة &copy; Glistéra</p>
        <p>تابعونا على <a href="#">إنستقرام</a> | <a href="#">تويتر</a></p>
    </footer>
 <script>
function validateAndRedirect() {
  var password = document.getElementById("password").value;
  var confirmPassword = document.getElementById("confirm-password").value;

  if (password !== confirmPassword) {
    alert("❌ كلمة المرور غير متطابقة، يرجى التأكد!");
    return;
  }

  const form = document.querySelector("form");
  if (form.checkValidity()) {
    alert("تم إنشاء الحساب بنجاح!");
    window.location.href = "login.html";
  } else {
    form.reportValidity();
  }
}
</script>
</body>
</html>
